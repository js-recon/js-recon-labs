name: Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    permissions:
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          for top in next_js detection; do
            if [ ! -d "$top" ]; then
              echo "'$top' directory not found."
              exit 1
            fi

            (
              cd "$top"
              for dir in */ ; do
                if [ -f "$dir/Dockerfile" ]; then
                  TAG=$(basename "$dir" | tr '[:upper:]' '[:lower:]')
                  GHCR_IMAGE="ghcr.io/js-recon/js-recon-labs:$TAG"

                  echo "Building and pushing to GHCR: $GHCR_IMAGE"

                  docker buildx build \
                    --platform linux/amd64,linux/arm64 \
                    -t "$GHCR_IMAGE" \
                    --push \
                    "$dir"
                else
                  echo "No Dockerfile found in $dir, skipping."
                fi
              done
            )
          done
